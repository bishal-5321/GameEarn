<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Earn</title><link rel="stylesheet" href="/style.css"></head><body><header><a class="brand" href="/">GAME<span>EARN</span></a><nav><a href="/dashboard.html">Dashboard</a><a href="/withdraw.html">Redeem</a></nav></header><main><small>EARN</small><h1>Choose your next reward.</h1><p>Eligible offers may pay up to $100; actual rewards vary.</p><div id="list"></div><section class="panel"><small>GAME REWARDS</small><h2>🎯 Specific Game</h2><p>Starting at 1,500 coins.</p><h2>🎲 Random Game</h2><p>Random reward range: $1–$5.</p><a class="btn" href="/withdraw.html">View redemption options</a></section></main><script>async function load(){let r=await fetch("/api/offers");if(!r.ok)return location="/";let a=(await r.json()).offers;list.innerHTML=a.map(o=>`<article class="offer panel"><div><span>${o.category}</span><h2>${o.title}</h2><p>Demo offer for testing.</p></div><div><b>+$${(o.reward_cents/100).toFixed(2)}</b><br><button onclick="done('${o.id}')">Demo complete</button></div></article>`).join("")}async function done(id){let r=await fetch("/api/offers/"+id+"/complete",{method:"POST"}),j=await r.json();alert(r.ok?"Reward credited!":j.error);if(r.ok)load()}load()</script></body></html>
