<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GameEarn - Redeem</title>

    <link rel="stylesheet" href="/style.css">

    <style>
        .reward-section {
            max-width: 1100px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .reward-title {
            font-size: 38px;
            margin-bottom: 8px;
        }

        .reward-subtitle {
            color: #8fa9d6;
            font-size: 18px;
            margin-bottom: 35px;
        }

        .steam-card {
            background: #0f1d30;
            border: 1px solid #263b59;
            border-radius: 18px;
            padding: 30px;
        }

        .steam-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 8px;
        }

        .steam-header h2 {
            margin: 0;
            font-size: 28px;
        }

        .steam-description {
            color: #8fa9d6;
            margin-bottom: 30px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 22px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group.full {
            grid-column: 1 / -1;
        }

        .form-group label {
            font-weight: 700;
            margin-bottom: 9px;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            box-sizing: border-box;
            background: #091626;
            border: 1px solid #29405f;
            border-radius: 12px;
            padding: 15px;
            color: white;
            font-size: 16px;
            outline: none;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            border-color: #4d7cff;
        }

        .form-group textarea {
            min-height: 120px;
            resize: vertical;
        }

        .fixed-payout {
            background: #172b48;
            border: 1px solid #35547d;
            border-radius: 12px;
            padding: 15px;
            font-size: 20px;
            font-weight: 800;
            color: white;
        }

        .fixed-payout small {
            display: block;
            color: #8fa9d6;
            font-size: 13px;
            margin-top: 4px;
            font-weight: 400;
        }

        .confirmation {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            margin-top: 25px;
            color: #d7e2f4;
        }

        .confirmation input {
            width: 20px;
            height: 20px;
            margin-top: 2px;
            accent-color: #4d7cff;
        }

        .submit-btn {
            margin-top: 25px;
            background: #4d7cff;
            border: none;
            color: white;
            padding: 15px 28px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
        }

        .submit-btn:hover {
            background: #3e6df0;
        }

        .submit-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        #withdrawMsg {
            margin-top: 18px;
            color: #8fa9d6;
            font-weight: 600;
        }

        @media (max-width: 700px) {
            .form-grid {
                grid-template-columns: 1fr;
            }

            .form-group.full {
                grid-column: auto;
            }

            .reward-title {
                font-size: 30px;
            }
        }
    </style>
</head>

<body>

<header>
    <a class="brand" href="/dashboard.html">
        GAME<span>EARN</span>
    </a>

    <nav>
        <a href="/dashboard.html">Dashboard</a>
        <a href="/offers.html">Earn</a>
    </nav>
</header>


<main class="reward-section">

    <h1 class="reward-title">
        Choose your reward.
    </h1>

    <p class="reward-subtitle">
        Select the reward you want and submit your request.
    </p>


    <section class="steam-card">

        <div class="steam-header">
            <span style="font-size:30px;">🎮</span>

            <h2>
                Steam Account Reward
            </h2>
        </div>

        <p class="steam-description">
            Request a Steam account with the specific game you want.
        </p>


        <div class="form-grid">

            <!-- FIXED PAYOUT -->

            <div class="form-group">

                <label>
                    Payout amount
                </label>

                <div class="fixed-payout">
                    $1.00

                    <small>
                        Fixed reward amount
                    </small>
                </div>

            </div>


            <!-- GAME -->

            <div class="form-group">

                <label for="game">
                    Specific game
                </label>

                <input
                    type="text"
                    id="game"
                    placeholder="Example: GTA V"
                    required
                >

            </div>


            <!-- EMAIL -->

            <div class="form-group">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Your email address"
                    required
                >

            </div>


            <!-- DISCORD -->

            <div class="form-group">

                <label for="discord">
                    Discord username
                </label>

                <input
                    type="text"
                    id="discord"
                    placeholder="@username"
                    required
                >

            </div>


            <!-- ADDITIONAL DETAILS -->

            <div class="form-group full">

                <label for="details">
                    Additional details
                </label>

                <textarea
                    id="details"
                    placeholder="Anything else we should know..."
                ></textarea>

            </div>

        </div>


        <!-- CONFIRMATION -->

        <label class="confirmation">

            <input
                type="checkbox"
                id="confirm"
            >

            <span>
                I confirm that the information I provided is
                correct and belongs to me.
            </span>

        </label>


        <!-- SUBMIT -->

        <button
            class="submit-btn"
            id="submitBtn"
            onclick="submitSteamReward()"
        >
            Submit request — $1.00
        </button>


        <div id="withdrawMsg"></div>

    </section>

</main>


<script>

async function submitSteamReward() {

    const game =
        document.getElementById("game").value.trim();

    const email =
        document.getElementById("email").value.trim();

    const discord =
        document.getElementById("discord").value.trim();

    const details =
        document.getElementById("details").value.trim();

    const confirm =
        document.getElementById("confirm").checked;

    const button =
        document.getElementById("submitBtn");

    const message =
        document.getElementById("withdrawMsg");


    if (!game) {
        message.textContent =
            "Please enter the game you want.";
        return;
    }


    if (!email) {
        message.textContent =
            "Please enter your email.";
        return;
    }


    if (!discord) {
        message.textContent =
            "Please enter your Discord username.";
        return;
    }


    if (!confirm) {
        message.textContent =
            "Please confirm that your information is correct.";
        return;
    }


    /*
        IMPORTANT:
        The payout is ALWAYS $1.00.

        The server currently calculates the withdrawal
        amount from the user's coin balance, so we send
        the reward information as the payment details.
    */

    const paymentDetails =
        JSON.stringify({
            rewardType: "Steam Account",
            amountUSD: 1.00,
            game: game,
            email: email,
            discord: discord,
            additionalDetails: details
        });


    button.disabled = true;
    button.textContent = "Submitting...";


    try {

        const response =
            await fetch("/api/withdraw", {

                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body: JSON.stringify({

                    telegramId:
                        String(
                            window.Telegram?.WebApp?.initDataUnsafe?.user?.id || ""
                        ),

                    method:
                        "Steam Account",

                    paymentDetails:
                        paymentDetails

                })

            });


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.error ||
                "Could not submit request."
            );

        }


        message.textContent =
            `Request #${data.withdrawalId} submitted successfully.`;


        button.textContent =
            "Request submitted ✓";


        document.getElementById("game").value = "";
        document.getElementById("email").value = "";
        document.getElementById("discord").value = "";
        document.getElementById("details").value = "";
        document.getElementById("confirm").checked = false;


    } catch (error) {

        console.error(error);

        message.textContent =
            error.message ||
            "Something went wrong. Please try again.";

        button.disabled = false;

        button.textContent =
            "Submit request — $1.00";
    }

}

</script>

</body>
</html>
