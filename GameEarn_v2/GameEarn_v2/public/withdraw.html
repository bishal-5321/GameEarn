<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Redeem</title><link rel="stylesheet" href="/style.css"></head><body><header><a class="brand" href="/">GAME<span>EARN</span></a><nav><a href="/dashboard.html">Dashboard</a><a href="/offers.html">Earn</a></nav></header><main><small>REDEEM</small><h1>Choose your reward.</h1><p>Minimum redemption is $1.00.</p><div class="redeem"><div class="panel"><div class="method">🇮🇳 <b>UPI</b><span>UPI ID</span></div><div class="method">🅿️ <b>PayPal</b><span>PayPal email or linked phone</span></div><div class="method">🎁 <b>Gift card</b><span>Email + type + amount</span></div><div class="method">🎮 <b>Game reward</b><span>Email + Discord username</span></div></div><form class="panel" id="f"><label>Amount (USD)</label><input id="amount" type="number" min="1" step=".01" value="1" required><label>Method</label><select id="method"><option value="paypal">PayPal</option><option value="upi">UPI</option><option value="gift_card">Gift card</option><option value="game_reward">Game reward</option></select><label>Details</label><textarea id="details" placeholder="UPI ID / PayPal email or phone / gift-card email and type / game-reward email and Discord username" required></textarea><button class="btn">Submit request</button><p id="msg" class="msg"></p></form></div></main><script>f.onsubmit=async e=>{e.preventDefault();let r=await fetch("/api/withdraw",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({amount_cents:Math.round(+amount.value*100),method:method.value,details:details.value})}),j=await r.json();msg.textContent=r.ok?"Request submitted — PENDING":j.error}</script></body></html>
