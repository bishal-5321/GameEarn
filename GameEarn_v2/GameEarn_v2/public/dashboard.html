<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard</title><link rel="stylesheet" href="/style.css"></head><body><header><a class="brand" href="/">GAME<span>EARN</span></a><nav><a href="/offers.html">Earn</a><a href="/withdraw.html">Redeem</a><a href="/referrals.html">Referrals</a><button id="out" class="link">Log out</button></nav></header><main><div class="dash"><div><small>YOUR DASHBOARD</small><h1>Hey, <span id="name">...</span> 👋</h1></div><div class="balance"><small>AVAILABLE</small><strong>$<span id="bal">0.00</span></strong></div></div><div class="features"><a class="feature" href="/offers.html">🎮<h3>Earn rewards</h3><p>Games, apps and tasks →</p></a><a class="feature" href="/withdraw.html">💳<h3>Redeem</h3><p>Minimum $1 →</p></a><a class="feature" href="/referrals.html">👥<h3>Refer friends</h3><p>Share your code →</p></a></div><section class="panel"><h2>Recent activity</h2><div id="tx">Loading...</div></section></main><script>async function load(){let r=await fetch("/api/me");if(!r.ok)return location="/";let u=(await r.json()).user;name.textContent=u.username;bal.textContent=(u.balance_cents/100).toFixed(2);let a=(await(await fetch("/api/transactions")).json()).transactions;tx.innerHTML=a.length?a.map(x=>`<p class="tx">${x.description}<b>${x.amount_cents>=0?"+":"-"}$${Math.abs(x.amount_cents/100).toFixed(2)}</b></p>`).join(""):"No activity yet."}out.onclick=async()=>{await fetch("/api/logout",{method:"POST"});location="/"};load()</script></body></html>
